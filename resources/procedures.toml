[[procedure]]
name = "Backup Core Database"
description = "Triggers the Core database backup at the scheduled time."
tags = ["system"]
config.schedule_timezone = "America/Los_Angeles"
config.schedule = "Every day at 01:00"

[[procedure.config.stage]]
name = "Backup Core Database"
enabled = true
executions = [
  { execution.type = "BackupCoreDatabase", execution.params = {}, enabled = true }
]

##

[[procedure]]
name = "Global Auto Update"
description = "Pulls and auto updates Stacks and Deployments using 'poll_for_updates' or 'auto_update'."
tags = ["system"]
config.schedule_timezone = "America/Los_Angeles"
config.schedule = "Every day at 03:00"

[[procedure.config.stage]]
name = "Global Auto Update"
enabled = true
executions = [
  { execution.type = "GlobalAutoUpdate", execution.params.skip_auto_update = false, enabled = true }
]

##

[[procedure]]
name = "saphnet-repo-sync"
description = "Update both the saphnet-compose-configs and saphnet-komodo repositories."
tags = ["main", "iac"]
config.schedule_enabled = false
config.schedule_format = "Cron"

[[procedure.config.stage]]
name = "Pull Repositories"
enabled = true
executions = [
    { execution.type = "BatchPullRepo", execution.params.pattern = """
saphnet-compose-configs
saphnet-komodo""", enabled = true }
]

## 

[[procedure]]
name = "saphnet-run-iac-stack-sync"
description = """
Run all Resource Syncs for IaC-managed Stacks, and redeploy any Stacks with changes.

NOTE: Make sure to run saphnet-repo-sync and manually confirm all of the Resource Sync changes before running this!
"""
tags = ["main", "iac"]
config.schedule_enabled = false
config.schedule_format = "Cron"

[[procedure.config.stage]]
name = "Run Stack Syncs"
enabled = true
executions = [
  { execution.type = "RunSync", execution.params.sync = "server-stack-syncs", enabled = true }
]

[[procedure.config.stage]]
name = "Redeploy Changed Stacks"
enabled = true
executions = [
  { execution.type = "BatchDeployStackIfChanged", execution.params.pattern = "*", execution.params.tags = ["iac"], enabled = true }
]

##

[[procedure]]
name = "saphnet-main-sync"
description = """
Regularly update all IaC repositories and sync Komodo state with the state of the repositories.

Updates variables, syncs the saphnet-compose-configs repo, and then runs saphnet-run-iac-stack-sync.
"""
tags = ["main", "iac"]
config.schedule_enabled = true
config.schedule_format = "Cron"
config.schedule = "0 */10 * * * *" # Every 10 minutes

[[procedure.config.stage]]
name = "Update Variables"
enabled = true
executions = [
  { execution.type = "RunAction", execution.params.action = "saphnet-update-tailscale-addresses", execution.params.args = {}, enabled = true },
]

[[procedure.config.stage]]
name = "Pull Repositories"
enabled = true
executions = [
  { execution.type = "PullRepo", execution.params.repo = "saphnet-compose-configs", enabled = true }
]

[[procedure.config.stage]]
name = "Run Stack Syncs"
enabled = true
executions = [
  { execution.ptype = "RunProcedure", execution.params.rocedure = "saphnet-run-iac-stack-sync", enabled = true },
]
