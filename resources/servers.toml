[[server]]
name = "control-server"
tags = ["control"]
[server.config]
address = "https://periphery:8120"
region = "Homelab"
enabled = true

##

[[server]]
name = "docker-host-core"
tags = ["core", "high-availability"]
[server.config]
address = "https://docker-host-core.int-net.saphnet.xyz:8120"
region = "Homelab"
enabled = true

##

[[server]]
name = "docker-host-pve3"
tags = ["gpu", "main"]
[server.config]
address = "https://docker-host-pve3.int-net.saphnet.xyz:8120"
region = "Homelab"
enabled = true

##

[[server]]
name = "docker-host-pve4"
tags = ["main"]
[server.config]
address = "https://docker-host-pve4.int-net.saphnet.xyz:8120"
region = "Homelab"
enabled = true

##

[[server]]
name = "vps1"
tags = ["vps"]
[server.config]
address = "https://vps1:8120"
external_address = "https://vps1.saphnet.xyz"
region = "Los Angeles, CA (VPS)"
enabled = true

## Builders

[[builder]]
name = "docker-host-pve3"
tags = ["iac"]
[builder.config]
type = "Server"
params.server_id = "docker-host-pve3"

##

[[builder]]
name = "docker-host-pve4"
tags = ["iac"]
[builder.config]
type = "Server"
params.server_id = "docker-host-pve4"

## Server resource syncs

[[resource_sync]]
name = "server-stack-syncs"
tags = ["iac"]
[resource_sync.config]
linked_repo = "saphnet-compose-configs"
resource_path = ["servers"]
match_tags = ["iac"]
